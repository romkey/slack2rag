# Production: runs the released image from ghcr.io with Qdrant and a local
# embedding server (Hugging Face Text Embeddings Inference, ModernBERT by
# default). Configure it in .env next to this file (see .env.example and
# docs/configuration.md).
#
#   docker compose -f docker-compose.prod.yaml up -d
#   APP_VERSION=1.2.3 docker compose -f docker-compose.prod.yaml up -d   # pin a release
#   docker compose -f docker-compose.prod.yaml build   # build the image locally instead
#
# Search the index:
#   docker compose -f docker-compose.prod.yaml run --rm app slack2rag query "deploy process"
#
# To use a remote provider such as OpenAI instead, set CONTAINER_LLM_BASE_URL,
# LLM_API_KEY, EMBEDDING_MODEL and the EMBEDDING_*_PREFIX settings in .env and
# leave out the local server: up -d --scale embeddings=0.
#
# Optional Ollama (for example for the evaluator's chat model): set
# COMPOSE_PROFILES=ollama (comma-separate it with other profiles) and point
# EVAL_BASE_URL or CONTAINER_LLM_BASE_URL at http://ollama:11434/v1.
#
# Optional PostgreSQL copy of the raw Slack data: set POSTGRES_* and
# DATABASE_URL (host db) in .env, then add --profile postgres to every
# command (or set COMPOSE_PROFILES=postgres in .env).
#
# The indexer doesn't listen on a port, so there is no HTTP health check;
# restart: unless-stopped brings it back if it exits.

services:
  app:
    image: ghcr.io/romkey/slack2rag:${APP_VERSION:-latest}
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      # The bundled embeddings service, unless .env sets
      # CONTAINER_LLM_BASE_URL. A separate name, so a host-only LLM_BASE_URL
      # (localhost) in .env can't point the container at itself.
      LLM_BASE_URL: ${CONTAINER_LLM_BASE_URL:-http://embeddings/v1}
      STATE_FILE: /data/state.json
    depends_on:
      qdrant:
        condition: service_healthy
      embeddings:
        condition: service_healthy
        required: false
      ollama:
        condition: service_started
        required: false
      migrate:
        condition: service_completed_successfully
        required: false
    volumes:
      - slack2rag_state:/data
      - slack2rag_results:/results   # EVAL_TEST output
    # Least privilege: nothing to write but /tmp, /data and /results, no
    # capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API, for other apps to query the index
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl or wget, so ask /readyz with bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 &&
          grep -q ' 200 ' <&3
      interval: 10s
      timeout: 5s
      retries: 5

  # Local embeddings: Hugging Face Text Embeddings Inference, serving
  # EMBEDDING_MODEL over its OpenAI-compatible /v1 API. It downloads the
  # model on first start. On ARM hosts (Apple silicon, Graviton) set
  # TEI_IMAGE_TAG=cpu-arm64-1.9.4 in .env.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_IMAGE_TAG:-cpu-1.9.4}
    restart: unless-stopped
    environment:
      MODEL_ID: ${EMBEDDING_MODEL:-nomic-ai/modernbert-embed-base}
      MAX_CLIENT_BATCH_SIZE: "128"  # above slack2rag's BATCH_SIZE (50)
      # Longest input, in tokens; longer ones are truncated. Higher values
      # need much more memory on CPU (8192 needs over 8 GB). Its own
      # setting, so an EMBEDDING_CONTEXT_LENGTH=8192 left in an older .env
      # can't get the server killed for lack of memory.
      MAX_BATCH_TOKENS: ${TEI_MAX_BATCH_TOKENS:-2048}
      AUTO_TRUNCATE: "true"
    volumes:
      - embeddings_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60  # first start downloads the model

  # Optional Ollama, via its OpenAI-compatible /v1 API. See the top of
  # this file.
  ollama:
    image: ollama/ollama:0.40.16
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  migrate:
    image: ghcr.io/romkey/slack2rag:${APP_VERSION:-latest}
    profiles: [postgres]
    command: ["slack2rag", "migrate"]
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:18-trixie
    profiles: [postgres]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

# The same volume names as the old docker-compose.yml, so an existing
# index and sync state carry over. PostgreSQL 18 needs a new volume; see
# CHANGELOG.md for moving data from the old postgres_data (PostgreSQL 16).
volumes:
  slack2rag_state:
  slack2rag_results:
  qdrant_data:
  embeddings_data:
  ollama_data:
  postgres18_data:
