services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional local inference server.  slack2rag uses OpenAI by default
  # (set LLM_API_KEY in .env).  To run models locally instead:
  #   1. In .env set LLM_BASE_URL=http://ollama:11434/v1 and
  #      EMBEDDING_MODEL=nomic-embed-text (plus EMBEDDING_CONTEXT_LENGTH if needed)
  #   2. docker compose --profile ollama up -d
  #   3. docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  slack2rag:
    # Use the pre-built image from GHCR when available, otherwise build locally.
    # Override with:  IMAGE=ghcr.io/you/slack2rag:latest docker compose up
    image: ${IMAGE:-}
    build: .
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - slack2rag_state:/data
    restart: unless-stopped

  # One-shot query tool — not started by default.
  # Usage:
  #   docker compose run --rm query "how do I reset my password?"
  #   docker compose run --rm query --limit 10 --channel engineering "deploy process"
  #   docker compose run --rm query --date-from 2024-06-01 "incident postmortem"
  query:
    image: ${IMAGE:-}
    build: .
    profiles: [query]
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    command: ["python", "-m", "src.query"]

  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: slack2rag
      POSTGRES_PASSWORD: slack2rag
      POSTGRES_DB: slack2rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slack2rag -d slack2rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qdrant_data:
  slack2rag_state:
  ollama_data:
  postgres_data:
